services:
  minecraft:
    # itzg/minecraft-server rebuilt on Amazon Corretto 25 (Minecraft 26.3 requires Java 25).
    # The alpine variant is used because itzg's build scripts support alpine, not Amazon Linux.
    build:
      context: https://github.com/itzg/docker-minecraft-server.git#2026.11.0
      args:
        BASE_IMAGE: amazoncorretto:25-alpine
    image: minecraft-server:corretto25
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      # FABRIC_LOADER_VERSION: "0.20.1" # uncomment to pin; defaults to latest stable loader
      MEMORY: "4G"
      MOTD: "Fabric 26.3 Server"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "20"
      TZ: "Etc/UTC"
      # Mods from Modrinth, listed in ./mods.txt and downloaded/updated on start
      MODRINTH_PROJECTS: "@/extras/mods.txt"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
    volumes:
      - ./data:/data
      - ./mods.txt:/extras/mods.txt:ro
