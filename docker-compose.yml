services:
  minecraft:
    image: itzg/minecraft-server:java25 # Minecraft 26.3 requires Java 25
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      # FABRIC_LOADER_VERSION: "0.20.1" # uncomment to pin; defaults to latest stable loader
      MEMORY: "4G"
      MOTD: "Fabric 26.3 Server"
      DIFFICULTY: "normal"
      MAX_PLAYERS: "20"
      TZ: "Etc/UTC"
    volumes:
      - ./data:/data
